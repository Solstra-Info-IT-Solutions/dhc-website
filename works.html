<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Our Works | Dream House Cinemas</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="works">

<section class="section-pad">
  <div class="wrap">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px;">
      <div>
        <div class="eyebrow">Our Work &mdash;</div>
        <h2 style="font-size:clamp(26px,3.5vw,36px);margin-top:10px;">Featured <span class="gold-grad">Work</span></h2>
      </div>
      <div id="filterBar" style="display:flex;flex-wrap:wrap;gap:10px;">
        <button class="filter-pill active" data-filter="all">ALL</button>
        <button class="filter-pill" data-filter="ad">AD FILMS</button>
        <button class="filter-pill" data-filter="doc">DOCUMENTARIES</button>
        <button class="filter-pill" data-filter="corp">CORPORATE FILMS</button>
        <button class="filter-pill" data-filter="brand">BRAND FILMS</button>
        <button class="filter-pill" data-filter="promo">PROMOTIONAL</button>
      </div>
    </div>

    <div id="workGrid" style="display:grid;grid-template-columns:1fr;gap:20px;margin-top:40px;">
      <div class="work-card" data-cat="ad" style="background-image:url('assets/work-adfilm.jpg')"><div class="play">&#9658;</div><div class="tag">AD FILM</div></div>
      <div class="work-card" data-cat="doc" style="background-image:url('assets/work-documentary.jpg')"><div class="play">&#9658;</div><div class="tag">DOCUMENTARY</div></div>
      <div class="work-card" data-cat="corp" style="background-image:url('assets/work-corporate.jpg')"><div class="play">&#9658;</div><div class="tag">CORPORATE FILM</div></div>
      <div class="work-card" data-cat="brand" style="background-image:url('assets/work-brand.jpg')"><div class="play">&#9658;</div><div class="tag">BRAND FILM</div></div>
      <div class="work-card" data-cat="promo" style="background-image:url('assets/work-promo.jpg')"><div class="play">&#9658;</div><div class="tag">PROMOTIONAL VIDEO</div></div>
      <div class="work-card" data-cat="ad" style="background-image:url('assets/work-jewellery.jpg')"><div class="play">&#9658;</div><div class="tag">JEWELLERY AD</div></div>
      <div class="work-card" data-cat="corp" style="background-image:url('assets/work-industrial.jpg')"><div class="play">&#9658;</div><div class="tag">INDUSTRIAL FILM</div></div>
      <div class="work-card" data-cat="doc" style="background-image:url('assets/work-healthcare.jpg')"><div class="play">&#9658;</div><div class="tag">HEALTHCARE FILM</div></div>
      <div class="work-card" data-cat="promo" style="background-image:url('assets/work-event.jpg')"><div class="play">&#9658;</div><div class="tag">EVENT FILM</div></div>
    </div>
  </div>
</section>

<!-- Video modal -->
<div id="videoModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;align-items:center;justify-content:center;padding:24px;">
  <div style="max-width:800px;width:100%;background:#111;border:1px solid var(--card-border);border-radius:6px;padding:20px;text-align:center;">
    <p style="color:#e2e2e2;font-size:14px;margin-bottom:16px;" id="modalLabel"></p>
    <p style="color:var(--text-muted);font-size:13px;">Video playback placeholder &mdash; connect to the actual project reel here.</p>
    <button id="closeModal" class="btn btn-outline" style="margin-top:18px;">CLOSE</button>
  </div>
</div>

<script>
  const mq = window.matchMedia('(min-width:768px)');
  const grid = document.getElementById('workGrid');
  function applyGrid(){ grid.style.gridTemplateColumns = mq.matches ? 'repeat(3,1fr)' : '1fr'; }
  applyGrid(); mq.addEventListener('change', applyGrid);

  const pills = document.querySelectorAll('.filter-pill');
  const cards = document.querySelectorAll('.work-card');
  pills.forEach(p => p.addEventListener('click', () => {
    pills.forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    const f = p.dataset.filter;
    cards.forEach(c => {
      c.style.display = (f === 'all' || c.dataset.cat === f) ? '' : 'none';
    });
  }));

  const modal = document.getElementById('videoModal');
  const modalLabel = document.getElementById('modalLabel');
  cards.forEach(c => c.addEventListener('click', () => {
    modalLabel.textContent = c.querySelector('.tag').textContent;
    modal.style.display = 'flex';
  }));
  document.getElementById('closeModal').addEventListener('click', () => modal.style.display = 'none');
  modal.addEventListener('click', (e) => { if(e.target === modal) modal.style.display = 'none'; });
</script>

<script src="js/components.js"></script>
</body>
</html>
